modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-2.1-only"

[[mods]]
modId = "forgia_compat"
version = "0.1.0"
displayName = "Forgia Compatibility"
description = '''
Serializes the event seams that are not thread-safe when Forgia runs a region's chunks on a worker thread.
Without it, a mod that handles block drops through a shared structure races itself and can throw out of a chunk
tick. Every patch is inert on a plain NeoForge core.
'''

[[mixins]]
config = "forgia_compat.mixins.json"

[[dependencies.forgia_compat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "SERVER"
